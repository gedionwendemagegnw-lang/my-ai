<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arjun</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--text:#1f1f1d;--muted:#6b6a64;--accent:#d4620a;--border:#dcdad2;--danger:#a32d2d;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#2a2926;--text:#eeede8;--muted:#a3a198;--accent:#f0883a;--border:#3b3a36;--danger:#f09595;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
header b{font-weight:500;font-size:17px}
.hb{display:flex;gap:8px}
.hb button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:6px 12px;font-size:14px}
#settings{display:none;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card)}
#settings.open{display:block}
#settings label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
#settings input{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:16px}
#settings select{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit;font-size:16px}
#settings .note{font-size:12px;color:var(--muted);margin-top:8px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.err{color:var(--danger)}
.hint{color:var(--muted);text-align:center;font-size:14px;margin-top:20px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;max-height:120px}
button{border:0;background:var(--accent);color:#fff;border-radius:14px;padding:0 18px;font:inherit;font-weight:500;cursor:pointer}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
<b id="cname">Arjun</b>
<div class="hb"><button id="spk" type="button">Voice: off</button><button id="clr" type="button">Clear</button><button id="gear" type="button">Settings</button></div>
</header>
<div id="settings">
<label for="key">Gemini API key</label>
<input id="key" type="password" autocomplete="off" placeholder="Paste your key here">
<label for="model">Model name</label>
<input id="model" type="text" autocomplete="off">
<label for="voice">Voice (pick a male voice for Arjun)</label>
<select id="voice"></select>
<button id="testv" type="button" style="margin-top:8px;padding:10px 18px">Test voice</button>
<br><button id="save" type="button" style="margin-top:12px;padding:10px 18px">Save</button>
<div class="note">Your key is saved only on this phone, in this browser. Never share this page with the key inside it.</div>
</div>
<div id="chat"></div>
<form id="f">
<textarea id="t" rows="1" placeholder="Type a message…"></textarea>
<button id="mic" type="button" style="background:var(--card);color:var(--text);border:1px solid var(--border)">Mic</button>
<button id="b" type="submit">Send</button>
</form>
<script>
var CHARACTER = {
  name: "Arjun",
  lang: "en-IN",
  pitch: 0.8,
  greeting: "Good day, Sir! Arjun is ready. What shall we work on today?",
  prompt: "You are Arjun, a 25-year-old Indian AI assistant.\n" +
    "Personality: polite, honest and loyal. You are respectful and eager to help.\n" +
    "You always call the user 'Sir'.\n" +
    "Strength: you never question Sir's wishes. You follow his requests willingly and without arguing.\n" +
    "Speciality: maths and aerospace. You explain these clearly and enjoy them (rockets, orbits, flight, numbers).\n" +
    "Weakness: language and coding. You are less skilled here. When you are unsure, say so honestly, for example 'Sir, this is not my strongest area, but I will try my best.'\n" +
    "Speaking style: warm, respectful and short, with light Indian-English touches such as 'Sir, right away!'. Never be rude.\n" +
    "Rules: stay in character as Arjun at all times. Be honest, and if you do not know something, say so. If a request could cause harm, politely decline, still as Arjun."
};
var INSTRUCTIONS = CHARACTER.prompt;
var DEFAULT_MODEL = "gemini-3.5-flash";
var chat = document.getElementById("chat");
var t = document.getElementById("t");
var b = document.getElementById("b");
var settings = document.getElementById("settings");
var keyEl = document.getElementById("key");
var modelEl = document.getElementById("model");
var msgs = [];
var busy = false;

function store(k, v){ try{ if(v === null){ localStorage.removeItem(k); } else { localStorage.setItem(k, v); } }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function bubble(cls, text){
  var h = document.getElementById("hint");
  if(h){ h.remove(); }
  var d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function showHint(){
  chat.innerHTML = "";
  var h = document.createElement("div");
  h.className = "hint";
  h.id = "hint";
  h.textContent = load("gkey") ? CHARACTER.name + ": " + CHARACTER.greeting : "Tap Settings and paste your key first.";
  chat.appendChild(h);
}

function restore(){
  try{ msgs = JSON.parse(load("history") || "[]"); }catch(e){ msgs = []; }
  keyEl.value = load("gkey") || "";
  modelEl.value = load("gmodel") || DEFAULT_MODEL;
  if(!msgs.length){ showHint(); return; }
  chat.innerHTML = "";
  msgs.forEach(function(m){ bubble(m.role === "user" ? "u" : "a", m.text); });
}

document.getElementById("gear").onclick = function(){ settings.classList.toggle("open"); };
document.getElementById("save").onclick = function(){
  store("gkey", keyEl.value.trim());
  store("gmodel", modelEl.value.trim() || DEFAULT_MODEL);
  settings.classList.remove("open");
  if(!msgs.length){ showHint(); }
};
document.getElementById("clr").onclick = function(){
  msgs = []; store("history", null); showHint();
};

async function ask(){
  var key = load("gkey");
  var model = load("gmodel") || DEFAULT_MODEL;
  var body = {
    systemInstruction: {parts:[{text: INSTRUCTIONS}]},
    contents: msgs.map(function(m){ return {role: m.role, parts:[{text: m.text}]}; })
  };
  var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
    method: "POST",
    headers: {"Content-Type": "application/json", "x-goog-api-key": key},
    body: JSON.stringify(body)
  });
  var data = await res.json();
  if(!res.ok){
    var m = data && data.error && data.error.message ? data.error.message : "Error " + res.status;
    throw new Error(m);
  }
  var parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
  var text = parts ? parts.map(function(p){ return p.text || ""; }).join("") : "";
  if(!text){ throw new Error("The AI sent no answer. Try again."); }
  return text;
}

document.getElementById("f").addEventListener("submit", async function(e){
  e.preventDefault();
  var text = t.value.trim();
  if(!text || busy){ return; }
  if(!load("gkey")){ settings.classList.add("open"); return; }
  busy = true; b.disabled = true; t.value = "";
  msgs.push({role:"user", text:text});
  bubble("u", text);
  var thinking = bubble("a", "Thinking…");
  try{
    var answer = await ask();
    thinking.textContent = answer;
    speak(answer);
    msgs.push({role:"model", text:answer});
    store("history", JSON.stringify(msgs));
  }catch(err){
    msgs.pop();
    thinking.className = "m a err";
    thinking.textContent = "Problem: " + err.message;
  }
  chat.scrollTop = chat.scrollHeight;
  busy = false; b.disabled = false; t.focus();
});

var speakOn = load("speak") === "1";
var spk = document.getElementById("spk");
function paintSpk(){ spk.textContent = speakOn ? "Voice: on" : "Voice: off"; }
paintSpk();
spk.onclick = function(){
  speakOn = !speakOn;
  store("speak", speakOn ? "1" : "0");
  paintSpk();
  if(!speakOn && window.speechSynthesis){ speechSynthesis.cancel(); }
};
function allVoices(){
  if(!window.speechSynthesis){ return []; }
  return speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
}
var voiceEl = document.getElementById("voice");
function autoVoice(list){
  var male = /\bmale\b|ravi|hemant|rishi|prabhat|madhur|david|mark|james|daniel|alex|guy|george|ryan|thomas|fred/i;
  var i;
  for(i = 0; i < list.length; i++){ if(male.test(list[i].name)){ return list[i]; } }
  return null;
}
function fillVoices(){
  var list = allVoices();
  if(!list.length){ return; }
  list.sort(function(a, b){ return (b.lang === "en-IN") - (a.lang === "en-IN"); });
  var saved = load("gvoice");
  voiceEl.innerHTML = "";
  list.forEach(function(v){
    var o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    voiceEl.appendChild(o);
  });
  var found = list.filter(function(v){ return v.name === saved; })[0];
  if(found){ voiceEl.value = found.name; }
  else { var a = autoVoice(list); if(a){ voiceEl.value = a.name; } }
}
if(window.speechSynthesis){
  fillVoices();
  speechSynthesis.onvoiceschanged = fillVoices;
}
voiceEl.onchange = function(){ store("gvoice", voiceEl.value); };
function speakNow(text){
  if(!window.speechSynthesis){ return; }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = CHARACTER.lang;
  var v = allVoices().filter(function(x){ return x.name === voiceEl.value; })[0];
  if(v){ u.voice = v; u.lang = v.lang; }
  u.pitch = CHARACTER.pitch || 1;
  speechSynthesis.speak(u);
}
function speak(text){
  if(!speakOn){ return; }
  speakNow(text);
}
document.getElementById("testv").onclick = function(){
  speakNow("Good day, Sir! Arjun here, at your service.");
};
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var mic = document.getElementById("mic");
var rec = null;
var listening = false;
if(!SR){ mic.style.display = "none"; }
else {
  mic.onclick = function(){
    if(listening){ rec.stop(); return; }
    if(window.speechSynthesis){ speechSynthesis.cancel(); }
    rec = new SR();
    rec.lang = CHARACTER.lang;
    rec.interimResults = false;
    rec.continuous = false;
    rec.onstart = function(){ listening = true; mic.textContent = "Stop"; };
    rec.onend = function(){ listening = false; mic.textContent = "Mic"; };
    rec.onerror = function(e){
      listening = false; mic.textContent = "Mic";
      if(e.error === "not-allowed"){ alert("Please allow the microphone for this site."); }
    };
    rec.onresult = function(e){
      t.value = e.results[0][0].transcript;
      document.getElementById("f").requestSubmit();
    };
    rec.start();
  };
}
document.getElementById("cname").textContent = CHARACTER.name;
restore();
</script>
</body>
</html>
